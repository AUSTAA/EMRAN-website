<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة البناء</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 40px;
    }

    .box {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 10px #ccc;
    }

    h1 {
      color: #333;
    }

    p {
      color: #555;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>حاسبة البناء</h1>
  <p>تطبيق لحساب مواد البناء بسهولة</p>
  <p>سيتم إضافة الحاسبات قريبًا</p>
</div>

</body>
</html>
